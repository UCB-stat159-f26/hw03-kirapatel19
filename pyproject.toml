[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Retrieve tennis career matches and plot player age differences."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["tennis_career*"]
